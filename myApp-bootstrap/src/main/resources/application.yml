server:
  port: 8080

spring:
  application:
    name: myApp
  datasource:
    # 服务器默认 3306；本机经 SSH 隧道开发时可覆盖：
    # SPRING_DATASOURCE_URL=jdbc:mysql://127.0.0.1:3307/myApp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/myApp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: root
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    connection-timeout: 10000
    validation-timeout: 5000
    keepalive-time: 60000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      table-underline: true

myapp:
  jwt:
    secret: ${JWT_SECRET:myApp-dev-secret-key-change-in-production-min-32chars}
    expiration-ms: 86400000

logging:
  level:
    root: INFO
    com.myapp: DEBUG
