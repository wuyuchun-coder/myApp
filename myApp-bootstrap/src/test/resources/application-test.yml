spring:
  datasource:
    # 需先建立 SSH 隧道：ssh -L 3307:127.0.0.1:3306 root@111.228.11.168
    url: jdbc:mysql://127.0.0.1:3307/myApp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      table-underline: true

myapp:
  jwt:
    secret: test-jwt-secret-key-for-integration-test-min-32
    expiration-ms: 86400000

logging:
  level:
    com.myapp: INFO
